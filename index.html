<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おはなしボタン</title>
<style>
  :root {
    --bg1: #ffe9f0;
    --bg2: #fff5e6;
    --btn: #ff8fab;
    --btn-hover: #ff6f91;
    --text: #4a3b3f;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--text);
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-size: 1.2rem;
    font-weight: 500;
    margin-bottom: 36px;
    opacity: 0.75;
  }
  .menu {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
    width: min(92vw, 620px);
  }
  .menu-link {
    display: block;
    border-radius: 24px;
    border: 3px solid transparent;
    background: var(--btn);
    color: white;
    text-decoration: none;
    padding: 30px 18px;
    font-size: 1.2rem;
    font-weight: 700;
    box-shadow: 0 8px 22px rgba(255, 111, 145, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease,
                background 0.15s ease, border-color 0.15s ease,
                filter 0.15s ease;
  }
  .menu-link:hover {
    background: var(--btn-hover);
    filter: brightness(1.06);
    border-color: rgba(255, 255, 255, 0.85);
    transform: scale(1.04);
    box-shadow: 0 14px 32px rgba(255, 111, 145, 0.55);
  }
  .menu-link:active {
    background: #e85d7a;
    border-color: #ffffff;
    transform: scale(0.96);
    box-shadow: 0 4px 12px rgba(255, 111, 145, 0.45);
  }
  .menu-link .sub {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    opacity: 0.85;
    margin-top: 6px;
  }

  /* カテゴリーごとの色（各ページのアクセントカラーと合わせている） */
  .menu-link.blue { background: #6fb7ff; box-shadow: 0 8px 22px rgba(111, 183, 255, 0.4); }
  .menu-link.blue:hover { background: #4f9fe8; }
  .menu-link.green { background: #6fcf97; box-shadow: 0 8px 22px rgba(111, 207, 151, 0.4); }
  .menu-link.green:hover { background: #4fae7c; }
  .menu-link.orange { background: #ffb35c; box-shadow: 0 8px 22px rgba(255, 179, 92, 0.4); }
  .menu-link.orange:hover { background: #f59a3c; }
  .menu-link.yellow { background: #ffd54f; color: #5c4a1a; box-shadow: 0 8px 22px rgba(255, 213, 79, 0.45); }
  .menu-link.yellow:hover { background: #f0c030; }
</style>
</head>
<body>

<h1>使いたいページを選んでください</h1>

<div class="menu">
  <a class="menu-link" href="kimochi.html">
    気持ちボタン
    <span class="sub">よく使う要望・緊急ボタン</span>
  </a>
  <a class="menu-link" href="aiueo.html">
    あいうえお表
    <span class="sub">50音から文章を組み立てて発声</span>
  </a>
  <a class="menu-link blue" href="karada-kimochi.html">
    からだ・きもち
    <span class="sub">あつい・さむい・いたい 等</span>
  </a>
  <a class="menu-link green" href="shitehoshii.html">
    してほしいこと
    <span class="sub">たべたい・ねたい 等</span>
  </a>
  <a class="menu-link orange" href="mono.html">
    もの
    <span class="sub">お茶・お水・くすり 等</span>
  </a>
  <a class="menu-link yellow" href="yobikake.html">
    呼びかけ・人
    <span class="sub">家族や先生の名前</span>
  </a>
</div>

</body>
</html>
