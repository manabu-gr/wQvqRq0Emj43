<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あいうえお表</title>
<style>
  :root {
    --bg1: #ffe9f0;
    --bg2: #fff5e6;
    --btn: #ff8fab;
    --btn-hover: #ff6f91;
    --btn-empty: transparent;
    --text: #4a3b3f;
    --accent: #6fb7ff;
    --accent-hover: #4f9fe8;
    --clear: #b0aaa8;
    --clear-hover: #948d8b;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--text);
    text-align: center;
    padding: 20px;
  }

  .top-nav {
    align-self: flex-start;
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .top-nav a {
    color: var(--text);
    opacity: 0.6;
    text-decoration: none;
  }
  .top-nav a:hover { opacity: 1; }

  h1 {
    font-size: 1.05rem;
    font-weight: 500;
    margin: 4px 0 16px;
    opacity: 0.75;
  }

  /* ===== 表示欄 ===== */
  #inputDisplay {
    width: min(94vw, 760px);
    min-height: 2.4em;
    background: #fff;
    border-radius: 16px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.08);
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 10px 20px;
    margin-bottom: 10px;
    color: var(--text);
    overflow-x: auto;
    white-space: nowrap;
  }
  #inputDisplay.empty::after {
    content: "ここに選んだ文字が並びます";
    opacity: 0.35;
    font-weight: 500;
    font-size: 0.85em;
  }

  /* ===== 発声/クリア/削除/読点 ボタン列 ===== */
  .controls {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .ctrl-btn {
    border: none;
    border-radius: 14px;
    padding: 12px 22px;
    font-size: 1rem;
    font-weight: 700;
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease, opacity 0.12s ease;
  }
  .ctrl-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
  .ctrl-btn:active { transform: scale(0.95); }
  .ctrl-btn:disabled {
    opacity: 0.4;
    cursor: default;
    transform: none;
    filter: none;
  }
  #speakBtn { background: var(--accent); }
  #speakBtn:hover:not(:disabled) { background: var(--accent-hover); }
  #clearBtn { background: var(--clear); }
  #clearBtn:hover { background: var(--clear-hover); }
  #backspaceBtn { background: var(--clear); }
  #backspaceBtn:hover { background: var(--clear-hover); }
  #commaBtn { background: var(--btn); }
  #commaBtn:hover { background: var(--btn-hover); }
  #questionBtn { background: var(--btn); }
  #questionBtn:hover { background: var(--btn-hover); }

  /* ===== 50音表グリッド ===== */
  .kana-grid {
    display: grid;
    grid-template-columns: repeat(11, 1fr);
    gap: 12px;
    width: min(96vw, 900px);
    margin-bottom: 14px;
  }
  .kana-btn {
    aspect-ratio: 1 / 1;
    border: 2px solid transparent;
    border-radius: 12px;
    background: var(--btn);
    color: white;
    font-size: clamp(0.85rem, 2.6vw, 1.25rem);
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(255, 111, 145, 0.3);
    transition: transform 0.1s ease, box-shadow 0.1s ease,
                background 0.1s ease, border-color 0.1s ease, filter 0.1s ease;
    padding: 2px;
  }
  .kana-btn:hover {
    background: var(--btn-hover);
    filter: brightness(1.06);
    border-color: rgba(255,255,255,0.85);
    transform: scale(1.08);
    box-shadow: 0 8px 18px rgba(255, 111, 145, 0.5);
  }
  .kana-btn:active,
  .kana-btn.just-clicked {
    background: #e85d7a;
    border-color: #ffffff;
    transform: scale(0.9);
    box-shadow: 0 3px 8px rgba(255, 111, 145, 0.4);
  }
  .kana-cell-empty {
    /* 「や」「わ」「ん」行の空セル：見た目だけ揃えるための透明な余白 */
    visibility: hidden;
  }
  .kana-grid.disabled .kana-btn {
    opacity: 0.45;
    pointer-events: none;
  }

  #status {
    font-size: 0.85rem;
    opacity: 0.6;
    min-height: 1.2em;
    margin-bottom: 10px;
  }

  #settings {
    margin-top: 6px;
    font-size: 0.78rem;
    opacity: 0.55;
  }
  #settings select {
    margin-top: 4px;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 0.78rem;
    max-width: 90vw;
  }

  details.help {
    width: min(94vw, 760px);
    margin-top: 18px;
    font-size: 0.8rem;
    opacity: 0.7;
    text-align: left;
  }
  details.help summary {
    cursor: pointer;
    text-align: center;
    opacity: 0.9;
  }
  details.help ul {
    margin: 8px 0 0;
    padding-left: 1.2em;
    line-height: 1.7;
  }
</style>
</head>
<body>

<div class="top-nav"><a href="index.html">← ホームにもどる</a></div>

<h1>文字を選んで、ことばを組み立てます</h1>

<div id="inputDisplay" class="empty"></div>

<div class="controls">
  <button class="ctrl-btn" id="speakBtn">発声</button>
  <button class="ctrl-btn" id="backspaceBtn">1文字削除</button>
  <button class="ctrl-btn" id="commaBtn">、（間をとる）</button>
  <button class="ctrl-btn" id="questionBtn">？（質問にする）</button>
  <button class="ctrl-btn" id="clearBtn">クリア</button>
</div>

<div class="kana-grid" id="kanaGrid"></div>

<div id="status">タップしてね</div>

<div id="settings">
  声の選択（自動で日本語の女性声を選んでいます）<br>
  <select id="voiceSelect"></select>
</div>

<details class="help">
  <summary>押し方のコツ（タップして開く）</summary>
  <ul>
    <li>1回タップ：そのままの文字（例：「か」）</li>
    <li>同じ文字を<b>素早く2回</b>タップ：濁音（例：「か」→「が」、「つ」→「っ」）</li>
    <li>同じ文字を<b>素早く3回</b>タップ：半濁音（例：「は」→「ぱ」、は行のみ）</li>
    <li>同じ文字を<b>少し間をあけてゆっくり2回</b>タップ：同じ文字を2つ並べる（例：「は」＋「は」→「はは」）</li>
    <li>「、」を入れると、発声のときに少し間があきます</li>
    <li>「？」を最後に入れると、質問っぽい上がり調子で読み上げます</li>
  </ul>
</details>

<script>
  /* ===================== 音声合成まわり（既存アプリと共通の仕組み） ===================== */
  const status = document.getElementById('status');
  const voiceSelect = document.getElementById('voiceSelect');

  let voices = [];
  let chosenVoice = null;

  function scoreVoice(v) {
    let score = 0;
    const name = v.name.toLowerCase();
    if (v.lang && v.lang.toLowerCase().startsWith('ja')) score += 100;
    if (name.includes('natural')) score += 40;
    if (name.includes('neural')) score += 40;
    if (name.includes('google')) score += 25;
    if (!v.localService) score += 15;
    if (name.includes('female') || name.includes('woman')) score += 20;
    if (name.includes('nanami') || name.includes('haruka') || name.includes('kyoko') || name.includes('o-ren') || name.includes('sayaka') || name.includes('mizuki')) score += 30;
    if (name.includes('male') || name.includes('otoya') || name.includes('ichiro')) score -= 100;
    return score;
  }

  function populateVoices() {
    voices = window.speechSynthesis.getVoices();
    voiceSelect.innerHTML = '';

    const jaVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ja'));
    const list = jaVoices.length > 0 ? jaVoices : voices;

    list
      .slice()
      .sort((a, b) => scoreVoice(b) - scoreVoice(a))
      .forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.name;
        opt.textContent = `${v.name} (${v.lang})${v.localService ? '' : ' ☁️'}`;
        voiceSelect.appendChild(opt);
      });

    if (list.length > 0) {
      const best = list.slice().sort((a, b) => scoreVoice(b) - scoreVoice(a))[0];
      voiceSelect.value = best.name;
      chosenVoice = best;
    } else {
      status.textContent = '日本語の音声が見つかりませんでした（ブラウザ設定をご確認ください）';
    }
  }

  voiceSelect.addEventListener('change', () => {
    chosenVoice = voices.find(v => v.name === voiceSelect.value) || null;
  });

  window.speechSynthesis.onvoiceschanged = populateVoices;
  populateVoices();

  /* ===================== 50音データ ===================== */
  // 各かなの「押した回数」に応じた変化パターン。1文字のみの配列＝濁音等なし。
  const variantMap = {
    'あ': ['あ'], 'い': ['い'], 'う': ['う'], 'え': ['え'], 'お': ['お'],
    'か': ['か', 'が'], 'き': ['き', 'ぎ'], 'く': ['く', 'ぐ'], 'け': ['け', 'げ'], 'こ': ['こ', 'ご'],
    'さ': ['さ', 'ざ'], 'し': ['し', 'じ'], 'す': ['す', 'ず'], 'せ': ['せ', 'ぜ'], 'そ': ['そ', 'ぞ'],
    'た': ['た', 'だ'], 'ち': ['ち', 'ぢ'], 'つ': ['つ', 'っ'], 'て': ['て', 'で'], 'と': ['と', 'ど'],
    'な': ['な'], 'に': ['に'], 'ぬ': ['ぬ'], 'ね': ['ね'], 'の': ['の'],
    'は': ['は', 'ば', 'ぱ'], 'ひ': ['ひ', 'び', 'ぴ'], 'ふ': ['ふ', 'ぶ', 'ぷ'], 'へ': ['へ', 'べ', 'ぺ'], 'ほ': ['ほ', 'ぼ', 'ぽ'],
    'ま': ['ま'], 'み': ['み'], 'む': ['む'], 'め': ['め'], 'も': ['も'],
    'や': ['や', 'ゃ'], 'ゆ': ['ゆ', 'ゅ'], 'よ': ['よ', 'ょ'],
    'ら': ['ら'], 'り': ['り'], 'る': ['る'], 'れ': ['れ'], 'ろ': ['ろ'],
    'わ': ['わ'], 'を': ['を'],
    'ん': ['ん'],
    '、': ['、'], '？': ['？'], 'ー': ['ー']
  };

  // 表の見た目：右から あかさたな… と並ぶように、配列は左(画面左)→右(画面右)の順で
  // 「ん」が一番左、「あ」が一番右になるよう並べている
  const columns = [
    { key: 'ん', rows: ['ん', '', '', '', 'ー'] },
    { key: 'わ', rows: ['わ', '', '', '', 'を'] },
    { key: 'ら', rows: ['ら', 'り', 'る', 'れ', 'ろ'] },
    { key: 'や', rows: ['や', '', 'ゆ', '', 'よ'] },
    { key: 'ま', rows: ['ま', 'み', 'む', 'め', 'も'] },
    { key: 'は', rows: ['は', 'ひ', 'ふ', 'へ', 'ほ'] },
    { key: 'な', rows: ['な', 'に', 'ぬ', 'ね', 'の'] },
    { key: 'た', rows: ['た', 'ち', 'つ', 'て', 'と'] },
    { key: 'さ', rows: ['さ', 'し', 'す', 'せ', 'そ'] },
    { key: 'か', rows: ['か', 'き', 'く', 'け', 'こ'] },
    { key: 'あ', rows: ['あ', 'い', 'う', 'え', 'お'] },
  ];

  /* ===================== グリッド生成 ===================== */
  const kanaGrid = document.getElementById('kanaGrid');

  for (let row = 0; row < 5; row++) {
    columns.forEach(col => {
      const ch = col.rows[row];
      if (ch === '') {
        const empty = document.createElement('div');
        empty.className = 'kana-cell-empty';
        kanaGrid.appendChild(empty);
      } else {
        const btn = document.createElement('button');
        btn.className = 'kana-btn';
        btn.textContent = ch;
        btn.dataset.kana = ch;
        btn.addEventListener('click', () => onKanaClick(ch, btn));
        kanaGrid.appendChild(btn);
      }
    });
  }

  /* ===================== 入力ロジック（濁音/半濁音/連続音の判定） ===================== */
  const FAST_MS = 350;  // これ以内の再タップ → 濁音/半濁音化
  const SLOW_MS = 900;  // これ以内（FAST_MSより遅い）の再タップ → 同じ文字を2つ並べる

  let composed = [];               // 表示中の文字の配列
  let comboState = { kana: null, index: -1, level: 1, time: 0 };

  const inputDisplay = document.getElementById('inputDisplay');
  const speakBtn = document.getElementById('speakBtn');

  function render() {
    const text = composed.join('');
    inputDisplay.textContent = text;
    inputDisplay.classList.toggle('empty', text.length === 0);
    speakBtn.disabled = text.length === 0;
  }

  function onKanaClick(kana, btnEl) {
    btnEl.classList.add('just-clicked');
    setTimeout(() => btnEl.classList.remove('just-clicked'), 150);

    const variants = variantMap[kana] || [kana];
    const now = Date.now();

    if (variants.length > 1 && comboState.kana === kana) {
      const elapsed = now - comboState.time;

      if (elapsed <= FAST_MS) {
        // 素早い連打 → 濁音・半濁音へ段階的に変化（最大パターン数まで）
        comboState.level = Math.min(comboState.level + 1, variants.length);
        composed[comboState.index] = variants[comboState.level - 1];
        comboState.time = now;
        render();
        return;
      } else if (elapsed <= SLOW_MS) {
        // ゆっくり2回 → 同じ文字をもう一つ並べる（「はは」等）
        composed.push(kana);
        comboState = { kana, index: composed.length - 1, level: 1, time: now };
        render();
        return;
      }
      // SLOW_MSを超えたら新規タップ扱いにフォールスルー
    }

    // 新規タップ（別の文字／初回／時間切れ）
    composed.push(kana);
    comboState = { kana, index: composed.length - 1, level: 1, time: now };
    render();
  }

  /* ===================== 発声・削除・クリア ===================== */
  const clearBtn = document.getElementById('clearBtn');
  const backspaceBtn = document.getElementById('backspaceBtn');
  const commaBtn = document.getElementById('commaBtn');
  const questionBtn = document.getElementById('questionBtn');

  function resetComposition() {
    composed = [];
    comboState = { kana: null, index: -1, level: 1, time: 0 };
    render();
  }

  function setGridEnabled(enabled) {
    kanaGrid.classList.toggle('disabled', !enabled);
    clearBtn.disabled = !enabled;
    backspaceBtn.disabled = !enabled;
    commaBtn.disabled = !enabled;
    questionBtn.disabled = !enabled;
  }

  speakBtn.addEventListener('click', () => {
    const text = composed.join('');
    if (!text || !('speechSynthesis' in window)) return;

    window.speechSynthesis.cancel();
    setGridEnabled(false);
    speakBtn.disabled = true;
    status.textContent = '再生中...';

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    if (chosenVoice) utter.voice = chosenVoice;
    utter.rate = 0.82;
    utter.pitch = 1.05;
    utter.volume = 1.0;

    const finish = () => {
      resetComposition();
      setGridEnabled(true);
      status.textContent = 'タップしてね';
    };

    utter.onend = finish;
    utter.onerror = finish;

    window.speechSynthesis.speak(utter);
  });

  clearBtn.addEventListener('click', () => {
    window.speechSynthesis.cancel();
    resetComposition();
    status.textContent = 'タップしてね';
  });

  backspaceBtn.addEventListener('click', () => {
    if (composed.length === 0) return;
    composed.pop();
    comboState = { kana: null, index: -1, level: 1, time: 0 };
    render();
  });

  commaBtn.addEventListener('click', () => {
    onKanaClick('、', commaBtn);
  });

  questionBtn.addEventListener('click', () => {
    onKanaClick('？', questionBtn);
  });

  render();
</script>

</body>
</html>
