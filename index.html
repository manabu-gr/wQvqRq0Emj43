<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おはなしボタン</title>
<style>
  :root {
    --bg1: #ffe9f0;
    --bg2: #fff5e6;
    --btn: #ff8fab;
    --btn-hover: #ff6f91;
    --text: #4a3b3f;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--text);
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-size: 1.2rem;
    font-weight: 500;
    margin-bottom: 36px;
    opacity: 0.75;
  }
  .menu {
    display: flex;
    flex-direction: column;
    gap: 28px;
    width: min(90vw, 420px);
  }
  .menu-link {
    display: block;
    border-radius: 24px;
    border: 3px solid transparent;
    background: var(--btn);
    color: white;
    text-decoration: none;
    padding: 34px 20px;
    font-size: 1.3rem;
    font-weight: 700;
    box-shadow: 0 8px 22px rgba(255, 111, 145, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease,
                background 0.15s ease, border-color 0.15s ease,
                filter 0.15s ease;
  }
  .menu-link:hover {
    background: var(--btn-hover);
    filter: brightness(1.06);
    border-color: rgba(255, 255, 255, 0.85);
    transform: scale(1.04);
    box-shadow: 0 14px 32px rgba(255, 111, 145, 0.55);
  }
  .menu-link:active {
    background: #e85d7a;
    border-color: #ffffff;
    transform: scale(0.96);
    box-shadow: 0 4px 12px rgba(255, 111, 145, 0.45);
  }
  .menu-link .sub {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    opacity: 0.85;
    margin-top: 6px;
  }
</style>
</head>
<body>

<h1>使いたいページを選んでください</h1>

<div class="menu">
  <a class="menu-link" href="kimochi.html">
    気持ちボタン
    <span class="sub">おとうさん・あつい・さむい 等＋緊急ボタン</span>
  </a>
  <a class="menu-link" href="aiueo.html">
    あいうえお表
    <span class="sub">50音から文章を組み立てて発声</span>
  </a>
</div>

</body>
</html>
